      <div id="main">
        <section class="post">
          <header class="major">
            <h1 id="contact-title">Kontakt</h1>
            <p id="contact-intro"></p>
          </header>

          <h2 id="contact-direct-title">Direkt</h2>
          <ul class="actions">
            <li><a class="button primary" href="mailto:info@4don.com" id="contact-mail-cta">Mail</a></li>
            <li>
              <a class="button" href="https://github.com/e4don" target="_blank" rel="noopener" id="contact-github-cta">GitHub</a>
            </li>
          </ul>

          <hr />

          <h2 id="contact-form-title">Nachricht senden</h2>
          <p id="contact-form-hint"></p>

          <form id="contact-form" method="POST">
            <!-- Honeypot (spam protection) -->
            <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" />

            <!-- Helpful metadata -->
            <input type="hidden" name="page" value="contact" />
            <input type="hidden" name="lang" id="contact-hidden-lang" value="en" />

            <div class="fields">
              <div class="field half">
                <label id="contact-label-name" for="contact-input-name">Name</label>
                <input type="text" name="name" id="contact-input-name" required />
              </div>

              <div class="field half">
                <label id="contact-label-email" for="contact-input-email">E-Mail</label>
                <input type="email" name="email" id="contact-input-email" required />
              </div>

              <div class="field">
                <label id="contact-label-message" for="contact-input-message">Nachricht</label>
                <textarea name="message" id="contact-input-message" rows="6" required></textarea>
              </div>
            </div>

            <ul class="actions">
              <li><button type="submit" class="button primary" id="contact-submit">Senden</button></li>
            </ul>

            <p id="contact-form-status" class="form-status" style="display:none; margin-top: 1rem;"></p>
          </form>
        </section>
